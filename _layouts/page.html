---
layout: default
---
<div class="container{% if page.narrow %} container--narrow{% endif %}">
  <header class="page-header">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </header>
  {% if page.prose %}
    <div class="prose section" style="padding-top:0">
      {{ content }}
    </div>
  {% else %}
    {{ content }}
  {% endif %}
</div>
