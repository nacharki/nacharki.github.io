<figure class="figure uplift-figure">
  <div class="matrix" role="img" aria-label="Two-by-two matrix of customer segments by propensity to convert and uplift from the recommendation. Persuadables, who convert because of the recommendation, are the target segment.">
    <div class="matrix__corner"></div>
    <div class="matrix__axis matrix__axis--x">Would they convert without the recommendation?</div>
    <div class="matrix__axis matrix__axis--y">Effect of showing it</div>
    <div class="matrix__cell matrix__cell--target">
      <span class="matrix__name">Persuadables</span>
      <span class="matrix__desc">Convert <em>because</em> of the recommendation.</span>
      <span class="matrix__action">Target</span>
    </div>
    <div class="matrix__cell">
      <span class="matrix__name">Sure things</span>
      <span class="matrix__desc">Book anyway, whatever is shown.</span>
      <span class="matrix__action">No effort needed</span>
    </div>
    <div class="matrix__cell">
      <span class="matrix__name">Sleeping dogs</span>
      <span class="matrix__desc">Trade down to a cheaper option if shown one.</span>
      <span class="matrix__action">Leave alone</span>
    </div>
    <div class="matrix__cell">
      <span class="matrix__name">Lost causes</span>
      <span class="matrix__desc">Will not convert either way.</span>
      <span class="matrix__action">Skip</span>
    </div>
  </div>
  <figcaption>Uplift modelling targets the segment whose behaviour changes because of the treatment, not the segment most likely to convert.</figcaption>
</figure>
