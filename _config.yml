# Site settings for nacharki.github.io
# Facts about experience, publications and talks live in _data/*.yml; case studies in _portfolio/.

locale                   : "en-GB"
title                    : "Naoufal Acharki"
title_separator          : "·"
name                     : "Naoufal Acharki"
description              : "Senior Data Scientist in Paris. A/B testing, uplift modelling and recommender systems for marketing teams. PhD in Applied Mathematics from École Polytechnique."
url                      : https://nacharki.github.io
baseurl                  : ""
repository               : "nacharki/nacharki.github.io"
og_image                 : "/images/og-image.png"
timezone                 : Europe/Paris

# Author / contact. Full URLs, used by the header, footer, contact block and JSON-LD.
author:
  name          : "Naoufal Acharki"
  first_name    : "Naoufal"
  headline      : "Senior Data Scientist"
  tagline       : "Marketing experimentation, causal ML and recommender systems"
  avatar        : "/images/naoufal-acharki.jpg"
  avatar_small  : "/images/naoufal-acharki-320.jpg"
  location      : "Paris, France"
  employer      : "Air France-KLM"
  email         : "naoufal.acharki@gmail.com"
  linkedin      : "https://www.linkedin.com/in/naoufal-acharki-4803ba12b/"
  github        : "https://github.com/nacharki"
  scholar       : "https://scholar.google.com/citations?user=2svE5nwAAAAJ"
  researchgate  : "https://www.researchgate.net/profile/Naoufal-Acharki"
  cv_pdf        : "/files/Naoufal_resume.pdf"
  availability  : "Open to senior data-science roles and selected freelance engagements in marketing analytics and causal ML."

# Reading files
include:
  - _pages
  - files
exclude:
  - .bundle
  - .claude
  - .git
  - .gitignore
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules
  - vendor
  - _config.dev.yml
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 2..3
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Collections
collections:
  portfolio:
    output: true
    permalink: /portfolio/:path/
    sort_by: order

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: portfolio
    values:
      layout: case-study

# Sass
sass:
  sass_dir: _sass
  style: compressed

permalink: /:title/

# Plugins (all whitelisted on GitHub Pages)
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development
